<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kita Berdua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf1ee;--surface:#fff8f6;--ink:#3a1f2b;--muted:#7d5f6b;--rose:#c2415d;--line:#ecd3d6;--gold:#b98a3e}
@media (prefers-color-scheme:dark){:root{--bg:#1e1118;--surface:#2a1822;--ink:#f6e6ea;--muted:#c4a3ae;--rose:#ef7b92;--line:#4a2d3a;--gold:#e0b46a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:24px 20px 64px}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(2rem,8vw,3rem);text-align:center;line-height:1.1}
h2{font-size:1.6rem;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
button{font:inherit;font-weight:600;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--rose);border:1px solid var(--rose)}
button.link{background:none;color:var(--muted);padding:2px 0;font-weight:400;font-size:.85rem}
.msg{color:var(--rose);min-height:1.4em;margin:6px 0}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.code{font-weight:600;color:var(--gold);letter-spacing:.05em}
.post{margin-bottom:36px}
.post h3{font-size:1.5rem;line-height:1.2}
.post time{display:block;color:var(--gold);font-weight:600;font-size:.95rem;margin:2px 0 10px}
.post img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-height:120px}
.actions{display:flex;gap:14px;align-items:center;margin:8px 0}
.like{background:none;color:var(--ink);padding:4px 0;font-weight:600}
.like.on{color:var(--rose)}
.cm{border-top:1px dashed var(--line);padding:8px 0}
.cm small{color:var(--muted)}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform input{margin:0}
</style>
</head>
<body>
<main>
<h1 id="siteTitle">Kita Berdua</h1>

<!-- 1. Masuk / daftar -->
<section id="vAuth" class="hidden" style="margin-top:28px">
  <div class="card">
    <h2>Masuk atau daftar</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
    <input id="pass" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password" aria-label="Password">
    <button id="bLogin">Masuk</button> <button id="bSignup" class="ghost">Daftar</button>
    <p class="msg" id="mAuth"></p>
  </div>
</section>

<!-- 2. Buat pasangan / gabung -->
<section id="vSetup" class="hidden" style="margin-top:28px">
  <div class="card">
    <h2>Buat ruang pasangan baru</h2>
    <input id="cName" placeholder="Nama ruang, misalnya: Kita Berdua" aria-label="Nama ruang">
    <input id="myName1" placeholder="Namamu" aria-label="Namamu">
    <button id="bCreate">Buat ruang</button>
  </div>
  <div class="card">
    <h2>Atau gabung dengan kode undangan</h2>
    <input id="code" placeholder="Kode dari pasanganmu" aria-label="Kode undangan">
    <input id="myName2" placeholder="Namamu" aria-label="Namamu">
    <button id="bJoin" class="ghost">Gabung</button>
  </div>
  <p class="msg" id="mSetup"></p>
  <button class="link" id="bOut1">Keluar akun</button>
</section>

<!-- 3. Aplikasi -->
<section id="vApp" class="hidden" style="margin-top:20px">
  <div class="top">
    <div><b id="cTitle"></b><br><small style="color:var(--muted)">Kode undangan: <span class="code" id="cCode"></span></small><br><button class="link" id="bRename">Ubah nama ruang</button></div>
    <button class="ghost" id="bOut2">Keluar</button>
  </div>
  <div id="feed"></div>
  <div class="card">
    <h2>Tambah foto</h2>
    <input id="pTitle" placeholder="Judul, misalnya: Liburan pertama ke Bali" aria-label="Judul">
    <input id="pDate" type="date" aria-label="Tanggal">
    <input id="pFile" type="file" accept="image/*" aria-label="Pilih foto">
    <textarea id="pCap" rows="2" placeholder="Cerita singkat (boleh dikosongkan)" aria-label="Cerita"></textarea>
    <button id="bPost">Tambah foto</button>
    <p class="msg" id="mPost"></p>
  </div>
</section>
</main>

<script>
// Kunci publik ini aman dipasang di kode web. Jangan pernah memasang kunci "secret".
const SUPABASE_URL = "https://dcrrrcrbmhghhxbfkzjt.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vqoso42wOQfVImHGMUupew_yESc1nN3";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let uid = null, cid = null, names = {};

function show(v){ ["vAuth","vSetup","vApp"].forEach(x => $(x).classList.toggle("hidden", x !== v)); if(v !== "vApp"){ $("siteTitle").textContent = "Kita Berdua"; document.title = "Kita Berdua"; } }
function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function fmt(d){ return new Date(d + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"}); }

// ---------- Rute ----------
async function route(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ uid = null; return show("vAuth"); }
  uid = session.user.id;
  const { data:m } = await sb.from("members").select("couple_id").eq("user_id", uid).maybeSingle();
  if(!m){ return show("vSetup"); }
  cid = m.couple_id;
  show("vApp");
  await loadApp();
}
sb.auth.onAuthStateChange(() => { route(); });

// ---------- Masuk / daftar ----------
$("bLogin").onclick = async () => {
  $("mAuth").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  if(error) $("mAuth").textContent = "Gagal masuk: " + error.message;
};
$("bSignup").onclick = async () => {
  $("mAuth").textContent = "";
  const { data, error } = await sb.auth.signUp({ email:$("email").value.trim(), password:$("pass").value });
  if(error) $("mAuth").textContent = "Gagal daftar: " + error.message;
  else if(!data.session) $("mAuth").textContent = "Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.";
};
async function logout(){ await sb.auth.signOut(); }
$("bOut1").onclick = logout; $("bOut2").onclick = logout;

// ---------- Buat / gabung pasangan ----------
$("bCreate").onclick = async () => {
  const n = $("cName").value.trim(), me = $("myName1").value.trim();
  if(!n || !me){ $("mSetup").textContent = "Isi nama ruang dan namamu dulu."; return; }
  const { error } = await sb.rpc("create_couple", { couple_name:n, my_name:me });
  if(error) $("mSetup").textContent = error.message; else route();
};
$("bJoin").onclick = async () => {
  const c = $("code").value.trim(), me = $("myName2").value.trim();
  if(!c || !me){ $("mSetup").textContent = "Isi kode undangan dan namamu dulu."; return; }
  const { error } = await sb.rpc("join_couple", { code:c, my_name:me });
  if(error) $("mSetup").textContent = error.message; else route();
};

// ---------- Aplikasi ----------
async function loadApp(){
  $("pDate").value = new Date().toISOString().slice(0,10);
  const { data:c } = await sb.from("couples").select("name,invite_code").eq("id", cid).single();
  if(c){ $("cTitle").textContent = c.name; $("cCode").textContent = c.invite_code; $("siteTitle").textContent = c.name; document.title = c.name; }
  const { data:ms } = await sb.from("members").select("user_id,display_name").eq("couple_id", cid);
  names = {}; (ms || []).forEach(m => names[m.user_id] = m.display_name);
  await loadFeed();
}

async function loadFeed(){
  const { data:posts, error } = await sb.from("posts")
    .select("id,author_id,title,post_date,caption,image_path,likes(user_id),comments(id,author_id,body,created_at)")
    .eq("couple_id", cid).order("post_date", { ascending:false }).order("created_at", { ascending:false });
  if(error){ $("feed").innerHTML = '<p class="msg">' + esc(error.message) + '</p>'; return; }
  if(!posts.length){ $("feed").innerHTML = '<p style="color:var(--muted)">Belum ada foto. Tambahkan kenangan pertama kalian di bawah.</p>'; return; }
  const { data:urls } = await sb.storage.from("photos").createSignedUrls(posts.map(p => p.image_path), 3600);
  const u = {}; (urls || []).forEach(x => u[x.path] = x.signedUrl);
  $("feed").innerHTML = posts.map(p => {
    const liked = p.likes.some(l => l.user_id === uid);
    const cms = p.comments.slice().sort((a,b) => a.created_at < b.created_at ? -1 : 1).map(k =>
      '<div class="cm"><small>' + esc(names[k.author_id] || "Pasangan") + '</small><br>' + esc(k.body) +
      (k.author_id === uid ? ' <button class="link" data-delcm="' + k.id + '">Hapus</button>' : '') + '</div>').join("");
    return '<article class="post"><h3>' + esc(p.title) + '</h3><time>' + fmt(p.post_date) + '</time>' +
      '<img src="' + esc(u[p.image_path] || "") + '" alt="' + esc(p.title) + '">' +
      '<div class="actions"><button class="like' + (liked ? " on" : "") + '" data-like="' + p.id + '" data-on="' + liked + '">' +
      (liked ? "♥" : "♡") + ' ' + p.likes.length + '</button>' +
      (p.author_id === uid ? '<button class="link" data-delpost="' + p.id + '" data-path="' + esc(p.image_path) + '">Hapus foto</button>' : '') + '</div>' +
      (p.caption ? '<p>' + esc(p.caption) + '</p>' : '') + cms +
      '<div class="cmform"><input placeholder="Tulis komentar" aria-label="Komentar" id="cm-' + p.id + '"><button data-cm="' + p.id + '">Kirim</button></div></article>';
  }).join("");
}

$("feed").onclick = async e => {
  const t = e.target;
  if(t.dataset.like){
    if(t.dataset.on === "true") await sb.from("likes").delete().eq("post_id", t.dataset.like).eq("user_id", uid);
    else await sb.from("likes").insert({ post_id:t.dataset.like });
    loadFeed();
  } else if(t.dataset.cm){
    const el = $("cm-" + t.dataset.cm), body = el.value.trim(); if(!body) return;
    await sb.from("comments").insert({ post_id:t.dataset.cm, body });
    loadFeed();
  } else if(t.dataset.delcm){
    await sb.from("comments").delete().eq("id", t.dataset.delcm); loadFeed();
  } else if(t.dataset.delpost && confirm("Hapus foto ini?")){
    await sb.storage.from("photos").remove([t.dataset.path]);
    await sb.from("posts").delete().eq("id", t.dataset.delpost); loadFeed();
  }
};

// Kecilkan foto sebelum diunggah
function shrink(file){
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : fail(new Error("Gagal memproses foto")), "image/jpeg", 0.8);
      };
      im.onerror = () => fail(new Error("File bukan gambar"));
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$("bPost").onclick = async () => {
  const title = $("pTitle").value.trim(), date = $("pDate").value, f = $("pFile").files[0];
  $("mPost").textContent = "";
  if(!title || !date || !f){ $("mPost").textContent = "Isi judul, tanggal, dan pilih foto dulu."; return; }
  $("bPost").disabled = true; $("mPost").textContent = "Mengunggah...";
  try{
    const blob = await shrink(f), path = cid + "/" + crypto.randomUUID() + ".jpg";
    const up = await sb.storage.from("photos").upload(path, blob, { contentType:"image/jpeg" });
    if(up.error) throw up.error;
    const ins = await sb.from("posts").insert({ couple_id:cid, title, post_date:date, caption:$("pCap").value.trim() || null, image_path:path });
    if(ins.error){ await sb.storage.from("photos").remove([path]); throw ins.error; }
    $("pTitle").value = ""; $("pCap").value = ""; $("pFile").value = ""; $("mPost").textContent = "";
    loadFeed();
  }catch(err){ $("mPost").textContent = "Gagal: " + err.message; }
  $("bPost").disabled = false;
};

route();

$("bRename").onclick = async () => {
  const n = prompt("Nama ruang baru:", $("cTitle").textContent);
  if(!n || !n.trim()) return;
  const { error } = await sb.from("couples").update({ name:n.trim() }).eq("id", cid);
  if(error) alert("Gagal mengubah nama: " + error.message); else loadApp();
};
</script>
</body>
</html>
