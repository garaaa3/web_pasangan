<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kita Berdua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf1ee;--surface:#fff8f6;--ink:#3a1f2b;--muted:#7d5f6b;--rose:#c2415d;--line:#ecd3d6;--gold:#b98a3e}
@media (prefers-color-scheme:dark){:root{--bg:#1e1118;--surface:#2a1822;--ink:#f6e6ea;--muted:#c4a3ae;--rose:#ef7b92;--line:#4a2d3a;--gold:#e0b46a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 20px 110px}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(2rem,8vw,3rem);text-align:center;line-height:1.1}
h2{font-size:1.6rem;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
button{font:inherit;font-weight:600;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--rose);border:1px solid var(--rose)}
button.link{background:none;color:var(--muted);padding:2px 0;font-weight:400;font-size:.85rem}
.msg{color:var(--rose);min-height:1.4em;margin:6px 0}
.hidden{display:none !important}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:20px 0;flex-wrap:wrap}
.code{font-weight:600;color:var(--gold);letter-spacing:.05em}

/* Kartu beranda */
.hero{text-align:center}
.names{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.2}
.names i{color:var(--rose)}
.since{color:var(--muted);margin:4px 0 14px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.clock div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.clock b{display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:1.8rem;color:var(--rose);line-height:1}
.clock span{font-size:.8rem;color:var(--muted)}
.next{color:var(--muted);margin:12px 0 0}
details{margin-top:14px;text-align:left}
summary{cursor:pointer;color:var(--rose);font-weight:600;text-align:center}
.editbox{margin-top:12px}
.editbox label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}

/* Postingan */
.post{margin-bottom:34px}
.post h3{font-size:1.5rem;line-height:1.2}
.post time{display:block;color:var(--gold);font-weight:600;font-size:.95rem;margin:2px 0 10px}
.slider{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;display:block}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;padding:2px 10px;border-radius:999px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;line-height:1}
.arrow.l{left:8px}.arrow.r{right:8px}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--rose)}
.post p{margin:8px 0 0}
.empty{color:var(--muted);text-align:center;margin:30px 0}

/* Menu bawah */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:220px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabbar button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
</style>
</head>
<body>
<main>
<h1 id="siteTitle">Kita Berdua</h1>

<!-- Masuk / daftar -->
<section id="vAuth" class="hidden" style="margin-top:28px">
  <div class="card">
    <h2>Masuk atau daftar</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
    <input id="pass" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password" aria-label="Password">
    <button id="bLogin">Masuk</button> <button id="bSignup" class="ghost">Daftar</button>
    <p class="msg" id="mAuth"></p>
  </div>
</section>

<!-- Buat pasangan / gabung -->
<section id="vSetup" class="hidden" style="margin-top:28px">
  <div class="card">
    <h2>Buat ruang pasangan baru</h2>
    <input id="cName" placeholder="Nama ruang, misalnya: Kita Berdua" aria-label="Nama ruang">
    <input id="myName1" placeholder="Namamu" aria-label="Namamu">
    <button id="bCreate">Buat ruang</button>
  </div>
  <div class="card">
    <h2>Atau gabung dengan kode undangan</h2>
    <input id="code" placeholder="Kode dari pasanganmu" aria-label="Kode undangan">
    <input id="myName2" placeholder="Namamu" aria-label="Namamu">
    <button id="bJoin" class="ghost">Gabung</button>
  </div>
  <p class="msg" id="mSetup"></p>
  <button class="link" id="bOut1">Keluar akun</button>
</section>

<!-- Aplikasi -->
<section id="vApp" class="hidden">
  <div class="top">
    <div>
      <b id="cTitle"></b><br>
      <small style="color:var(--muted)">Kode undangan: <span class="code" id="cCode"></span></small><br>
      <button class="link" id="bRename">Ubah nama ruang</button>
    </div>
    <button class="ghost" id="bOut2">Keluar</button>
  </div>

  <!-- Beranda -->
  <div id="tabBeranda">
    <div class="card hero">
      <div class="names"><span id="nA">Kamu</span> <i>&amp;</i> <span id="nB">Dia</span></div>
      <p class="since" id="since"></p>
      <div class="clock" id="kClock">
        <div><b id="kD">0</b><span>hari</span></div>
        <div><b id="kH">0</b><span>jam</span></div>
        <div><b id="kM">0</b><span>menit</span></div>
        <div><b id="kS">0</b><span>detik</span></div>
      </div>
      <p class="next" id="next"></p>
      <details>
        <summary>Ubah nama dan tanggal jadian</summary>
        <div class="editbox">
          <label for="eMe">Namamu</label>
          <input id="eMe" placeholder="Namamu">
          <label for="eDate">Tanggal jadian</label>
          <input type="date" id="eDate">
          <button id="bSaveInfo">Simpan</button>
          <p class="msg" id="mInfo"></p>
        </div>
      </details>
    </div>
    <div id="feed"></div>
  </div>

  <!-- Tambah postingan -->
  <div id="tabTambah" class="hidden">
    <div class="card">
      <h2>Postingan baru</h2>
      <input id="pTitle" placeholder="Judul, misalnya: Liburan pertama ke Bali" aria-label="Judul">
      <input id="pDate" type="date" aria-label="Tanggal">
      <input id="pFile" type="file" accept="image/*" multiple aria-label="Pilih foto (bisa lebih dari satu)">
      <p id="fCount" style="color:var(--muted);margin:0 0 10px"></p>
      <textarea id="pCap" rows="2" placeholder="Cerita singkat (boleh dikosongkan)" aria-label="Cerita"></textarea>
      <button id="bPost">Posting</button>
      <p class="msg" id="mPost"></p>
    </div>
  </div>
</section>
</main>

<nav class="tabbar hidden" id="nav">
  <button class="on" data-tab="beranda">Beranda</button>
  <button data-tab="tambah">+ Tambah</button>
</nav>

<script>
// Kunci publik ini aman dipasang di kode web. Jangan pernah memasang kunci "secret".
const SUPABASE_URL = "https://dcrrrcrbmhghhxbfkzjt.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vqoso42wOQfVImHGMUupew_yESc1nN3";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let uid = null, cid = null, names = {}, startDate = null, postsById = {};

function show(v){
  ["vAuth","vSetup","vApp"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  $("nav").classList.toggle("hidden", v !== "vApp");
  if(v !== "vApp"){ $("siteTitle").textContent = "Kita Berdua"; document.title = "Kita Berdua"; }
}
function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML.replace(/"/g, "&quot;"); }
function fmt(d){ return new Date(d + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"}); }

function tab(t){
  $("tabBeranda").classList.toggle("hidden", t !== "beranda");
  $("tabTambah").classList.toggle("hidden", t !== "tambah");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => tab(b.dataset.tab));

// ---------- Rute ----------
async function route(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ uid = null; return show("vAuth"); }
  uid = session.user.id;
  const { data:m } = await sb.from("members").select("couple_id").eq("user_id", uid).maybeSingle();
  if(!m){ return show("vSetup"); }
  cid = m.couple_id;
  show("vApp");
  await loadApp();
}
sb.auth.onAuthStateChange(() => { route(); });

// ---------- Masuk / daftar ----------
$("bLogin").onclick = async () => {
  $("mAuth").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  if(error) $("mAuth").textContent = "Gagal masuk: " + error.message;
};
$("bSignup").onclick = async () => {
  $("mAuth").textContent = "";
  const { data, error } = await sb.auth.signUp({ email:$("email").value.trim(), password:$("pass").value });
  if(error) $("mAuth").textContent = "Gagal daftar: " + error.message;
  else if(!data.session) $("mAuth").textContent = "Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.";
};
async function logout(){ await sb.auth.signOut(); }
$("bOut1").onclick = logout; $("bOut2").onclick = logout;

// ---------- Buat / gabung pasangan ----------
$("bCreate").onclick = async () => {
  const n = $("cName").value.trim(), me = $("myName1").value.trim();
  if(!n || !me){ $("mSetup").textContent = "Isi nama ruang dan namamu dulu."; return; }
  const { error } = await sb.rpc("create_couple", { couple_name:n, my_name:me });
  if(error) $("mSetup").textContent = error.message; else route();
};
$("bJoin").onclick = async () => {
  const c = $("code").value.trim(), me = $("myName2").value.trim();
  if(!c || !me){ $("mSetup").textContent = "Isi kode undangan dan namamu dulu."; return; }
  const { error } = await sb.rpc("join_couple", { code:c, my_name:me });
  if(error) $("mSetup").textContent = error.message; else route();
};

// ---------- Memuat data ----------
async function loadApp(){
  $("pDate").value = new Date().toISOString().slice(0,10);
  const { data:c } = await sb.from("couples").select("name,invite_code,start_date").eq("id", cid).single();
  if(c){
    $("cTitle").textContent = c.name; $("cCode").textContent = c.invite_code;
    $("siteTitle").textContent = c.name; document.title = c.name;
    startDate = c.start_date || null;
  }
  const { data:ms } = await sb.from("members").select("user_id,display_name").eq("couple_id", cid);
  names = {}; (ms || []).forEach(m => names[m.user_id] = m.display_name);
  const me = (ms || []).find(m => m.user_id === uid), other = (ms || []).find(m => m.user_id !== uid);
  $("nA").textContent = me ? me.display_name : "Kamu";
  $("nB").textContent = other ? other.display_name : "Menunggu pasangan...";
  $("eMe").value = me ? me.display_name : "";
  $("eDate").value = startDate || "";
  tick();
  await loadFeed();
}

function tick(){
  if(!startDate){
    $("kClock").style.display = "none";
    $("since").textContent = "Belum ada tanggal jadian. Isi lewat Ubah nama dan tanggal jadian.";
    $("next").textContent = "";
    return;
  }
  $("kClock").style.display = "";
  $("since").textContent = "Bersama sejak " + fmt(startDate);
  const st = new Date(startDate + "T00:00:00"), now = new Date();
  const s = Math.max(0, Math.floor((now - st) / 1000));
  $("kD").textContent = Math.floor(s / 86400);
  $("kH").textContent = Math.floor(s % 86400 / 3600);
  $("kM").textContent = Math.floor(s % 3600 / 60);
  $("kS").textContent = s % 60;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const nx = new Date(now.getFullYear(), st.getMonth(), st.getDate());
  if(nx < today) nx.setFullYear(nx.getFullYear() + 1);
  const left = Math.round((nx - today) / 86400000), yrs = nx.getFullYear() - st.getFullYear();
  $("next").textContent = left === 0 ? "Selamat hari jadi ke-" + yrs + "!" : left + " hari lagi menuju hari jadi ke-" + yrs;
}
setInterval(tick, 1000);

function pathsOf(p){ return (p.image_paths && p.image_paths.length) ? p.image_paths : [p.image_path]; }

async function loadFeed(){
  const { data:posts, error } = await sb.from("posts")
    .select("id,author_id,title,post_date,caption,image_path,image_paths")
    .eq("couple_id", cid).order("post_date", { ascending:false }).order("created_at", { ascending:false });
  if(error){ $("feed").innerHTML = '<p class="msg">' + esc(error.message) + '</p>'; return; }
  postsById = {}; posts.forEach(p => postsById[p.id] = p);
  if(!posts.length){ $("feed").innerHTML = '<p class="empty">Belum ada postingan. Ketuk + Tambah untuk mengunggah kenangan pertama kalian.</p>'; return; }
  const all = []; posts.forEach(p => pathsOf(p).forEach(x => all.push(x)));
  const { data:urls } = await sb.storage.from("photos").createSignedUrls(all, 3600);
  const u = {}; (urls || []).forEach(x => u[x.path] = x.signedUrl);
  $("feed").innerHTML = posts.map(p => {
    const ps = pathsOf(p), many = ps.length > 1;
    const imgs = ps.map((x, i) => '<img loading="lazy" src="' + esc(u[x] || "") + '" alt="' + esc(p.title) + ' foto ' + (i + 1) + '">').join("");
    return '<article class="post"><h3>' + esc(p.title) + '</h3>' +
      '<time>' + fmt(p.post_date) + ' · ' + esc(names[p.author_id] || "Pasangan") + '</time>' +
      '<div class="slider"><div class="track">' + imgs + '</div>' +
      (many ? '<span class="count">1/' + ps.length + '</span>' +
        '<button class="arrow l" data-nav="prev" aria-label="Foto sebelumnya">‹</button>' +
        '<button class="arrow r" data-nav="next" aria-label="Foto berikutnya">›</button>' : '') + '</div>' +
      (many ? '<div class="dots">' + ps.map((_, i) => '<span class="dot' + (i === 0 ? " on" : "") + '"></span>').join("") + '</div>' : '') +
      (p.caption ? '<p>' + esc(p.caption) + '</p>' : '') +
      (p.author_id === uid ? '<button class="link" data-delpost="' + p.id + '">Hapus postingan</button>' : '') +
      '</article>';
  }).join("");
}

// Penanda geser foto (1/3 dan titik)
$("feed").addEventListener("scroll", e => {
  const t = e.target;
  if(!t.classList || !t.classList.contains("track")) return;
  const i = Math.round(t.scrollLeft / t.clientWidth);
  const art = t.closest(".post");
  const c = art.querySelector(".count"); if(c) c.textContent = (i + 1) + "/" + t.children.length;
  art.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("on", k === i));
}, true);

$("feed").onclick = async e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.nav){
    const tr = t.closest(".slider").querySelector(".track");
    tr.scrollBy({ left:(t.dataset.nav === "next" ? 1 : -1) * tr.clientWidth, behavior:"smooth" });
  } else if(t.dataset.delpost){
    const p = postsById[t.dataset.delpost];
    if(!p || !confirm("Hapus postingan ini beserta semua fotonya?")) return;
    await sb.storage.from("photos").remove(pathsOf(p));
    await sb.from("posts").delete().eq("id", p.id);
    loadFeed();
  }
};

// ---------- Ubah nama ruang / nama / tanggal jadian ----------
$("bRename").onclick = async () => {
  const n = prompt("Nama ruang baru:", $("cTitle").textContent);
  if(!n || !n.trim()) return;
  const { error } = await sb.from("couples").update({ name:n.trim() }).eq("id", cid);
  if(error) alert("Gagal mengubah nama: " + error.message); else loadApp();
};
$("bSaveInfo").onclick = async () => {
  $("mInfo").textContent = "";
  const n = $("eMe").value.trim(), d = $("eDate").value || null;
  if(!n){ $("mInfo").textContent = "Nama tidak boleh kosong."; return; }
  const r1 = await sb.from("members").update({ display_name:n }).eq("couple_id", cid).eq("user_id", uid);
  if(r1.error){ $("mInfo").textContent = "Gagal menyimpan nama: " + r1.error.message; return; }
  const r2 = await sb.from("couples").update({ start_date:d }).eq("id", cid);
  if(r2.error){ $("mInfo").textContent = "Gagal menyimpan tanggal: " + r2.error.message; return; }
  $("mInfo").textContent = "Tersimpan.";
  await loadApp();
};

// ---------- Unggah banyak foto ----------
function shrink(file){
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : fail(new Error("Gagal memproses foto")), "image/jpeg", 0.8);
      };
      im.onerror = () => fail(new Error("File bukan gambar"));
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$("pFile").onchange = () => {
  const n = $("pFile").files.length;
  $("fCount").textContent = n ? (n > 10 ? "10 foto pertama yang dipakai (maksimal 10)" : n + " foto dipilih") : "";
};

$("bPost").onclick = async () => {
  const title = $("pTitle").value.trim(), date = $("pDate").value, files = Array.from($("pFile").files).slice(0, 10);
  $("mPost").textContent = "";
  if(!title || !date || !files.length){ $("mPost").textContent = "Isi judul, tanggal, dan pilih minimal satu foto."; return; }
  $("bPost").disabled = true;
  const paths = []; let done = false;
  try{
    for(let i = 0; i < files.length; i++){
      $("mPost").textContent = "Mengunggah " + (i + 1) + " dari " + files.length + "...";
      const blob = await shrink(files[i]), path = cid + "/" + crypto.randomUUID() + ".jpg";
      const up = await sb.storage.from("photos").upload(path, blob, { contentType:"image/jpeg" });
      if(up.error) throw up.error;
      paths.push(path);
    }
    const ins = await sb.from("posts").insert({
      couple_id:cid, title, post_date:date, caption:$("pCap").value.trim() || null,
      image_path:paths[0], image_paths:paths
    });
    if(ins.error) throw ins.error;
    done = true;
  }catch(err){
    if(paths.length) await sb.storage.from("photos").remove(paths);
    $("mPost").textContent = "Gagal: " + err.message;
  }
  $("bPost").disabled = false;
  if(done){
    $("pTitle").value = ""; $("pCap").value = ""; $("pFile").value = ""; $("fCount").textContent = ""; $("mPost").textContent = "";
    tab("beranda"); loadFeed();
  }
};

route();
</script>
</body>
</html>
